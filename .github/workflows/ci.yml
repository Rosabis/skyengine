name: Build and publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev pkg-config zlib1g-dev

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target skyengine --parallel

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_dir="dist/skyengine-${{ matrix.platform }}"
          mkdir -p "${package_dir}"
          install -m 0755 build/skyengine "${package_dir}/skyengine"
          cp -a wasm/dist/fs/mythroad "${package_dir}/mythroad"
          install -m 0644 README.md LICENSE "${package_dir}"
          tar -czf "dist/skyengine-${{ matrix.platform }}.tar.gz" -C dist "skyengine-${{ matrix.platform }}"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/skyengine-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item -Path "build/Release/skyengine.exe", "build/Release/SDL2.dll" -Destination $packageDir
          Copy-Item -Path "wasm/dist/fs/mythroad" -Destination $packageDir -Recurse
          Copy-Item -Path "README.md", "LICENSE" -Destination $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/skyengine-${{ matrix.platform }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/skyengine-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake pkg-config sdl2 zlib

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build
        run: cmake --build build --config Release --target skyengine --parallel

      - name: Package
        shell: bash
        run: |
          package_dir="dist/skyengine-macos"
          mkdir -p "${package_dir}"
          install -m 0755 build/skyengine "${package_dir}/skyengine"
          cp -a wasm/dist/fs/mythroad "${package_dir}/mythroad"
          install -m 0644 README.md LICENSE "${package_dir}"
          tar -czf "dist/skyengine-macos.tar.gz" -C dist "skyengine-macos"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/skyengine-macos.*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          sdkmanager --licenses || true

      - name: Build APK
        env:
          # fetchNativeDeps/download 需要网络拉取 SDL2/unicorn 到 android/third_party。
          ORG_GRADLE_JVM_ARGS: "-Xmx4g"
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs:
      - build
      - macos
      - android
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish continuous prerelease
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete continuous \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes >/dev/null 2>&1 || true
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/continuous" >/dev/null 2>&1 || true
          gh release create continuous release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Continuous" \
            --notes "Automated preview build from commit ${GITHUB_SHA}." \
            --prerelease

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi